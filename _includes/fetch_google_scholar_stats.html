<script>
    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/'
        {% endif %}
        $.getJSON(gsDataBaseUrl + "google-scholar-stats/gs_data.json", function (data) {
            var totalCitation = data['citedby']
            var totalEl = document.getElementById('total_cit');
            if (totalEl) totalEl.innerHTML = totalCitation;
            var citationEles = document.getElementsByClassName('show_paper_citations')
            Array.prototype.forEach.call(citationEles, element => {
                var paperId = element.getAttribute('data')
                var pub = data['publications'] && data['publications'][paperId];
                var numCitations = pub ? pub['num_citations'] : null;
                if (numCitations !== null) element.innerHTML = '| Citations: ' + numCitations;
            });

            // If the page has a publications placeholder, render the list from the Scholar JSON.
            // This keeps `_pages/about.md` automatically updated without manual edits.
            var publicationsContainer = document.getElementById('publications-list');
            if (publicationsContainer && data['publications']) {
                function renderAuthors(authorsRaw) {
                    var raw = (authorsRaw || '').toString();
                    if (!raw) return null;

                    // Normalize separators: "and" / Chinese comma -> comma.
                    raw = raw.replace(/\s+and\s+/g, ', ').replace(/，/g, ', ');
                    var parts = raw.split(',').map(function (p) { return p.trim(); }).filter(Boolean);

                    var frag = document.createDocumentFragment();
                    parts.forEach(function (name, idx) {
                        if (idx > 0) frag.appendChild(document.createTextNode(', '));

                        if (name === 'Xu Wang' || name === '王旭') {
                            var strong = document.createElement('strong');
                            strong.textContent = name;
                            frag.appendChild(strong);
                        } else {
                            frag.appendChild(document.createTextNode(name));
                        }
                    });

                    return frag;
                }

                var publications = data['publications'];
                var pubList = Object.keys(publications).map(function (id) {
                    return publications[id];
                });

                pubList.sort(function (a, b) {
                    var ay = parseInt((a.bib && a.bib.pub_year) ? a.bib.pub_year : '0', 10);
                    var by = parseInt((b.bib && b.bib.pub_year) ? b.bib.pub_year : '0', 10);
                    if (by !== ay) return by - ay; // Year desc

                    var ac = (a.num_citations !== undefined && a.num_citations !== null) ? a.num_citations : 0;
                    var bc = (b.num_citations !== undefined && b.num_citations !== null) ? b.num_citations : 0;
                    return bc - ac; // Citations desc
                });

                publicationsContainer.innerHTML = '';
                var ol = document.createElement('ol');
                pubList.forEach(function (pub) {
                    var title = (pub.bib && pub.bib.title) ? pub.bib.title : '';
                    var year = (pub.bib && pub.bib.pub_year) ? pub.bib.pub_year : '';
                    var authors = (pub.bib && pub.bib.author) ? pub.bib.author : '';
                    var journal = (pub.bib && pub.bib.journal) ? pub.bib.journal : '';
                    var conference = (pub.bib && pub.bib.conference) ? pub.bib.conference : '';
                    var venue = journal || conference;
                    var citations = (pub.num_citations !== undefined && pub.num_citations !== null) ? pub.num_citations : null;
                    var link = (pub.eprint_url || pub.pub_url || pub.citedby_url || '');

                    var li = document.createElement('li');
                    if (title) li.appendChild(document.createTextNode(title));
                    if (year) li.appendChild(document.createTextNode(' (' + year + ')'));

                    if (venue) {
                        li.appendChild(document.createTextNode(' — '));
                        var venueStrong = document.createElement('strong');
                        venueStrong.textContent = venue;
                        li.appendChild(venueStrong);
                    }

                    var authorsFrag = renderAuthors(authors);
                    if (authorsFrag) {
                        li.appendChild(document.createTextNode(' | '));
                        li.appendChild(authorsFrag);
                    }

                    if (citations !== null) {
                        li.appendChild(document.createTextNode(' | Citations: '));
                        var citStrong = document.createElement('strong');
                        citStrong.textContent = citations;
                        li.appendChild(citStrong);
                    }

                    if (link) {
                        var a = document.createElement('a');
                        var href = link;
                        if (href.startsWith('/')) href = 'https://scholar.google.com' + href;
                        a.href = href;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.textContent = 'Link';
                        li.appendChild(document.createTextNode(' | '));
                        li.appendChild(a);
                    }
                    ol.appendChild(li);
                });
                publicationsContainer.appendChild(ol);
            }
        });
    })
</script>
